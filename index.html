<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>meus jogos</title>
  <meta name="description" content="agenda diária de flamengo, manchester city, real madrid e borussia dortmund">
  <meta name="theme-color" content="#050608">
  <link rel="icon" href="imagens/logo.svg?v=20261104224919" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/base.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/fundo.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/hoje.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/times.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/listas.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/classificacao.css?v=20261104224919">
  <link rel="stylesheet" href="estilos/responsivo.css?v=20261104224919">
</head>
<body>
  <div class="palco" aria-hidden="true">
    <span class="refletor refletor-esq"></span>
    <span class="refletor refletor-dir"></span>
    <span class="brilho-chao"></span>
  </div>

  <header class="topo">
    <!-- logo: bola de futebol + bolinha "ao vivo" = acompanhar os jogos. tocar nela volta pra home -->
    <a class="marca" id="ir-home" href="./" aria-label="meus jogos, voltar para a home">
      <svg class="marca-logo" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <defs>
          <clipPath id="corte-logo"><circle cx="17" cy="19" r="11.8"/></clipPath>
          <!-- um gomo da borda + a costura até o pentágono do meio; repetido 5 vezes girando -->
          <g id="gomo-logo">
            <path d="M17 9.7l-3.99-2.9 1.52-4.7h4.94l1.52 4.7z" fill="currentColor"/>
            <path d="M17 14V9.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </defs>
        <g class="marca-bola">
          <circle cx="17" cy="19" r="13" stroke="currentColor" stroke-width="2.4"/>
          <g clip-path="url(#corte-logo)">
            <path d="M17 14l4.76 3.45-1.82 5.6h-5.88l-1.82-5.6z" fill="currentColor"/>
            <use href="#gomo-logo"/>
            <use href="#gomo-logo" transform="rotate(72 17 19)"/>
            <use href="#gomo-logo" transform="rotate(144 17 19)"/>
            <use href="#gomo-logo" transform="rotate(216 17 19)"/>
            <use href="#gomo-logo" transform="rotate(288 17 19)"/>
          </g>
        </g>
        <circle class="marca-vivo" cx="29.5" cy="7" r="4.5" fill="var(--vivo)" stroke="var(--fundo)" stroke-width="2.5"/>
      </svg>
    </a>
    <div class="topo-acoes">
      <button class="botao-atualizar" id="atualizar" type="button" aria-label="atualizar agora" title="atualizar agora">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>


  <main class="pagina">
    <section class="bloco bloco-hoje" aria-labelledby="t-hoje">
      <h2 class="bloco-titulo" id="t-hoje">
        <span>hoje</span>
        <span class="data-hoje" id="data-hoje"></span>
        <span class="atualizado" id="atualizado" aria-live="polite"></span>
      </h2>
      <div id="hoje" class="hoje"></div>
    </section>

    <section class="bloco bloco-meus-times" aria-labelledby="t-times">
      <h2 class="bloco-titulo" id="t-times"><span>meus times</span></h2>
      <nav class="filtros" id="filtros" aria-label="filtrar por time"></nav>
    </section>

    <section class="bloco" aria-labelledby="t-classificacao">
      <h2 class="bloco-titulo" id="t-classificacao"><span>classificação</span></h2>
      <div id="classificacao" class="classificacao"></div>
    </section>

    <section class="bloco" aria-labelledby="t-proximos">
      <h2 class="bloco-titulo" id="t-proximos"><span>próximos jogos</span></h2>
      <div id="proximos" class="painel"></div>
    </section>

    <section class="bloco" aria-labelledby="t-resultados">
      <h2 class="bloco-titulo" id="t-resultados"><span>últimos resultados</span></h2>
      <div id="resultados" class="painel"></div>
    </section>
  </main>

  <script src="site.js?v=20261104224919" defer></script>
</body>
</html>
